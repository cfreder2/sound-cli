<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sound Preview</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230d1014'/%3E%3Cpath d='M2 8h2V5h2v6h2V3h2v10h2V6h2v2' stroke='%23ffb74d' fill='none' stroke-width='1.4'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0d1014; --panel:#141a20; --panel2:#1b232b; --line:#26313b;
    --fg:#e8eef3; --dim:#8b9aa7; --dimmer:#5d6b78;
    --a:#ffb74d;          /* 8-bit  */
    --b:#6fe6ff;          /* 16-bit */
    --good:#6dffa8; --hot:#ff7a6b;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{padding:0 16px 64px}
  a{color:var(--b)}
  .wrap{max-width:1180px;margin:0 auto}

  header{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 72%,transparent);
    padding:14px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px}
  .bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  h1{font:600 15px/1 var(--mono);letter-spacing:.16em;margin:0;text-transform:uppercase}
  h1 span{color:var(--dimmer);font-weight:400}
  .grow{flex:1}

  .ab{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
  .ab button{border:0;background:var(--panel);color:var(--dim);font:600 12px/1 var(--mono);
    letter-spacing:.1em;padding:9px 16px;cursor:pointer;transition:.12s}
  .ab button:hover{color:var(--fg)}
  .ab button.on:first-child{background:var(--a);color:#1a1200}
  .ab button.on:last-child{background:var(--b);color:#001820}
  .ab button:first-child{border-right:1px solid var(--line)}
  .ab button i{font-style:normal;font-size:9px;opacity:.55;margin-left:6px;letter-spacing:.06em}
  .ab button.on i{opacity:.75}

  .btn{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:7px;
    font:600 12px/1 var(--mono);letter-spacing:.08em;padding:9px 14px;cursor:pointer}
  .btn:hover{background:var(--panel2);border-color:#3a4a58}
  .btn.tiny{padding:5px 9px;font-size:11px;letter-spacing:.04em}
  .btn[disabled]{opacity:.4;cursor:default}
  input[type=range]{accent-color:var(--b);width:110px}

  nav{display:flex;gap:4px;margin:14px 0 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  nav button{border:0;border-bottom:2px solid transparent;background:none;color:var(--dim);
    font:600 12px/1 var(--mono);letter-spacing:.12em;padding:11px 14px;cursor:pointer}
  nav button.on{color:var(--fg);border-bottom-color:var(--a)}
  nav .sp{flex:1}
  #q{background:var(--panel);border:1px solid var(--line);border-radius:6px;color:var(--fg);
    font:12px/1 var(--mono);padding:8px 11px;width:210px;margin:0 0 6px}
  #q::placeholder{color:var(--dimmer)}
  #q:focus{outline:none;border-color:var(--b)}
  #qn{color:var(--dimmer);font:10px/1 var(--mono);letter-spacing:.08em;margin:0 0 6px 9px;align-self:center}

  .grid{display:grid;grid-template-columns:270px 1fr;gap:18px;align-items:start}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}

  .list{border:1px solid var(--line);border-radius:9px;background:var(--panel);overflow:hidden}
  .list button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);
    background:none;color:var(--fg);padding:11px 13px;cursor:pointer}
  .list button:last-child{border-bottom:0}
  .list button:hover{background:var(--panel2)}
  .list button.on{background:var(--panel2);box-shadow:inset 3px 0 var(--a)}
  .list .t{font:600 13px/1.3 var(--mono);letter-spacing:.04em}
  .list .s{color:var(--dim);font:11px/1.5 var(--mono);margin-top:3px}
  .list .grp{padding:9px 13px 5px;color:var(--dimmer);font:9px/1 var(--mono);
    letter-spacing:.16em;border-bottom:1px solid var(--line);background:#101519}

  .card{border:1px solid var(--line);border-radius:9px;background:var(--panel);padding:16px}
  .card h2{margin:0 0 3px;font:600 17px/1.2 var(--mono);letter-spacing:.04em}
  .meta{color:var(--dim);font:11px/1.6 var(--mono);letter-spacing:.03em}
  .blurb{color:var(--dim);font-size:13px;margin:13px 0;white-space:pre-wrap;
    border-left:2px solid var(--line);padding-left:12px}
  .blurb.clip{max-height:96px;overflow:hidden;
    -webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}
  .more{background:none;border:0;color:var(--b);font:11px/1 var(--mono);letter-spacing:.08em;
    cursor:pointer;padding:4px 0}

  canvas{width:100%;height:76px;display:block;background:#0a0d11;border:1px solid var(--line);
    border-radius:6px;margin:14px 0 8px}
  .transport{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
  .keys{display:flex;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .keys button{border:0;border-right:1px solid var(--line);background:var(--panel2);color:var(--fg);
    width:46px;height:38px;display:grid;place-items:center;cursor:pointer;transition:.12s}
  .keys button:last-child{border-right:0}
  .keys button:hover{background:#26323d}
  .keys button[disabled]{opacity:.3;cursor:default}
  .keys button.on{background:var(--good);color:#04180d}
  .keys svg{width:15px;height:15px;fill:currentColor}
  .time{font:12px/1 var(--mono);color:var(--fg);min-width:96px;font-variant-numeric:tabular-nums}
  .barno{font:11px/1 var(--mono);color:var(--dim);min-width:74px}
  .speed{display:flex;align-items:center;gap:7px;margin-left:auto}
  .speed label{font:10px/1 var(--mono);letter-spacing:.1em;color:var(--dimmer)}
  .speed input{width:112px}
  .speed .v{font:11px/1 var(--mono);color:var(--b);min-width:42px;text-align:right}
  .speed button{background:none;border:0;color:var(--dimmer);cursor:pointer;font:10px/1 var(--mono)}
  .loopbtn{border:1px solid var(--line);background:var(--panel2);color:var(--dim);border-radius:7px;
    font:600 10px/1 var(--mono);letter-spacing:.1em;padding:11px 12px;cursor:pointer}
  .loopbtn.on{background:var(--good);color:#04180d;border-color:var(--good)}

  table{width:100%;border-collapse:collapse;font:12px/1.5 var(--mono);margin-top:12px}
  th,td{text-align:left;padding:6px 9px;border-bottom:1px solid var(--line)}
  th{color:var(--dimmer);font-weight:600;letter-spacing:.08em;font-size:10px;text-transform:uppercase}
  td.n{color:var(--dim)}
  .swap{color:var(--a)}

  details{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
  summary{cursor:pointer;color:var(--dim);font:11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase}
  pre{font:11.5px/1.5 var(--mono);color:#c8d4de;background:#0a0d11;border:1px solid var(--line);
    border-radius:6px;padding:12px;overflow:auto;max-height:460px;margin-top:12px}

  .fxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
  .fx{border:1px solid var(--line);border-radius:9px;background:var(--panel);padding:13px}
  .fx .n{font:600 13px/1.2 var(--mono);letter-spacing:.04em}
  .fx .d{color:var(--dim);font-size:12px;margin:5px 0 10px;min-height:32px}
  .fx .row{display:flex;gap:7px}
  .fx .row button{flex:1}
  .fire{border:1px solid var(--line);border-radius:6px;padding:8px;cursor:pointer;
    font:600 11px/1 var(--mono);letter-spacing:.1em;background:var(--panel2);color:var(--dim)}
  .fire.a:hover,.fire.a.lit{background:var(--a);color:#1a1200;border-color:var(--a)}
  .fire.b:hover,.fire.b.lit{background:var(--b);color:#001820;border-color:var(--b)}
  .layers{display:flex;gap:3px;margin-top:9px;flex-wrap:wrap}
  .layers button{flex:1;min-width:26px;border:1px solid var(--line);background:#0a0d11;color:var(--dimmer);
    border-radius:4px;font:10px/1 var(--mono);padding:6px 0;cursor:pointer}
  .layers button:hover{color:var(--fg);border-color:var(--b)}
  .hint{color:var(--dimmer);font-size:11px;margin-top:7px}

  /* loading */
  #load{position:fixed;left:0;top:0;height:2px;width:0;z-index:99;background:var(--b);
    box-shadow:0 0 8px var(--b);transition:width .25s ease,opacity .3s;opacity:0}
  #load.on{opacity:1}
  .loading{display:flex;align-items:center;gap:9px;color:var(--dim);font:11px/1 var(--mono);
    letter-spacing:.08em}
  .spin{width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--b);
    border-radius:50%;animation:spin .7s linear infinite;flex:none}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ghost{background:linear-gradient(90deg,#141a20,#1e262f,#141a20);background-size:200% 100%;
    animation:sweep 1.4s linear infinite;border-radius:6px}
  @keyframes sweep{to{background-position:-200% 0}}
  canvas.pending{opacity:.25}

  /* layer visualiser */
  .lanes{border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-top:10px}
  .lane{display:grid;grid-template-columns:104px 62px 1fr 56px;gap:10px;align-items:center;
    padding:7px 11px;border-bottom:1px solid var(--line);background:var(--panel)}
  .lane:last-child{border-bottom:0}
  .lane.off{opacity:.34}
  .lane .nm{font:11px/1.3 var(--mono);letter-spacing:.03em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lane .nm small{display:block;color:var(--dimmer);font-size:9.5px}
  .lane canvas{height:34px;margin:0;border:0;background:#0a0d11;border-radius:4px}
  .lane .lvl{font:10px/1 var(--mono);color:var(--dimmer);text-align:right}
  .ms{display:flex;gap:4px}
  .ms button{width:27px;height:25px;border:1px solid var(--line);background:#0a0d11;color:var(--dimmer);
    border-radius:4px;font:9px/1 var(--mono);font-weight:700;cursor:pointer}
  .ms button:hover{color:var(--fg)}
  .ms button.m.on{background:var(--hot);color:#2a0a06;border-color:var(--hot)}
  .ms button.s.on{background:var(--good);color:#04180d;border-color:var(--good)}
  td .hear{border:1px solid var(--line);background:#0a0d11;color:var(--dim);border-radius:4px;
    font:10px/1 var(--mono);padding:5px 9px;cursor:pointer}
  td .hear:hover{color:var(--fg);border-color:var(--b)}
  td .hear.lit{background:var(--b);color:#001820;border-color:var(--b)}
  .panelhead{display:flex;gap:10px;align-items:center;margin-top:20px;
    border-top:1px solid var(--line);padding-top:14px}
  .panelhead h3{margin:0;font:600 11px/1 var(--mono);letter-spacing:.14em;
    text-transform:uppercase;color:var(--a)}

    color:var(--a);margin:26px 0 8px}
  .note{border-left:2px solid var(--a);padding-left:13px;color:var(--dim);font-size:12px;margin:14px 0}
  /* keyboard */
  .kb{position:relative;height:150px;margin:16px 0 8px;user-select:none;touch-action:none}
  .kb .w{position:absolute;top:0;bottom:0;border:1px solid #2a343d;border-radius:0 0 5px 5px;
    background:linear-gradient(#f2f5f7,#cfd8de);box-shadow:inset 0 -6px 10px rgba(0,0,0,.12)}
  .kb .b{position:absolute;top:0;height:62%;border-radius:0 0 4px 4px;z-index:2;
    background:linear-gradient(#333c45,#11171c);box-shadow:inset 0 -4px 6px rgba(0,0,0,.5)}
  .kb .w.on{background:linear-gradient(var(--a),#d79733)}
  .kb .b.on{background:linear-gradient(var(--a),#a86f16)}
  .kb .lbl{position:absolute;bottom:5px;width:100%;text-align:center;
    font:9px var(--mono);color:#6c7a85;pointer-events:none}
  .kb .b .lbl{bottom:4px;color:#7d8b96}
  .rec{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:12px 0}
  .rec select,.rec input[type=number]{background:var(--panel);border:1px solid var(--line);
    color:var(--fg);border-radius:6px;font:12px var(--mono);padding:7px 9px}
  .rec input[type=number]{width:66px}
  .recbtn{border:1px solid var(--hot);background:var(--panel);color:var(--hot);border-radius:7px;
    font:600 12px/1 var(--mono);letter-spacing:.1em;padding:9px 15px;cursor:pointer}
  .recbtn.on{background:var(--hot);color:#2a0a06}
  .kstat{font:11px/1.5 var(--mono);color:var(--dim);min-height:1.5em}
  .ii{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;
    border:1px solid var(--line);border-radius:50%;background:var(--panel);color:var(--dim);
    font:9px/1 var(--mono);cursor:help;margin-left:5px;vertical-align:middle;flex:none;padding:0}
  .ii:hover,.ii.on{border-color:var(--b);color:var(--b)}
  .pop{position:fixed;z-index:300;max-width:300px;background:var(--panel2);color:#d6e0e8;
    border:1px solid var(--b);border-radius:7px;padding:10px 12px;font:11.5px/1.55 var(--mono);
    box-shadow:0 8px 24px rgba(0,0,0,.6)}
  .pop b{color:var(--b);font-weight:400;display:block;margin-bottom:4px;letter-spacing:.08em}
  .kstat b{color:var(--good);font-weight:400}
  /* editor */
  .ed{display:grid;grid-template-columns:200px 1fr;gap:12px;align-items:start}
  @media(max-width:760px){.ed{grid-template-columns:1fr}}
  .trk{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
  .trk .row{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;
    padding:8px 9px;border-bottom:1px solid var(--line);cursor:pointer}
  .trk .row:last-child{border-bottom:0}
  .trk .row.sel{background:var(--panel2);box-shadow:inset 3px 0 var(--a)}
  .trk .row.armed{box-shadow:inset 3px 0 var(--hot)}
  .trk .nm{font:11px/1.3 var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .trk .nm small{display:block;color:var(--dimmer);font-size:9px}
  .trk .btns{display:flex;gap:3px}
  .trk .btns button{width:22px;height:20px;border:1px solid var(--line);background:#0a0d11;
    color:var(--dimmer);border-radius:3px;font:8px/1 var(--mono);cursor:pointer;padding:0}
  .trk .btns .a.on{background:var(--hot);color:#2a0a06;border-color:var(--hot)}
  .trk .btns .m.on{background:var(--hot);color:#2a0a06;border-color:var(--hot)}
  .trk .btns .s.on{background:var(--good);color:#04180d;border-color:var(--good)}
  .roll{border:1px solid var(--line);border-radius:8px;background:#0a0d11;overflow:auto}
  .roll canvas{display:block;cursor:crosshair}
  .edbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
  .edbar .sp{flex:1}
  #err{display:none;position:fixed;left:12px;right:12px;bottom:12px;z-index:200;max-height:38vh;overflow:auto;
    border:1px solid var(--hot);border-radius:8px;background:#1b0f0d;color:#ffd9d3;
    font:11.5px/1.5 var(--mono);padding:11px 13px;white-space:pre-wrap}
  #err.on{display:block}
  #err b{color:var(--hot)}
  #err button{float:right;background:none;border:1px solid var(--hot);color:var(--hot);
    border-radius:4px;font:10px var(--mono);padding:2px 7px;cursor:pointer}
</style>
</head>
<body>
<div id="load"></div>
<div id="err"></div>
<div class="wrap">
<header>
  <div class="bar">
    <h1>Sound <span>// preview</span></h1>
    <div class="ab" id="era">
      <button data-era="8bit" class="on">8-BIT<i></i></button>
      <button data-era="16bit">16-BIT<i></i></button>
    </div>
    <span class="meta" id="eranote"></span>
    <div class="grow"></div>
    <span class="meta" title="Low shelf at 200 Hz">BASS</span>
    <input type="range" id="bass" min="-12" max="12" step="0.5" value="0" style="width:84px">
    <span class="meta" title="High shelf at 3 kHz">TREBLE</span>
    <input type="range" id="treb" min="-12" max="12" step="0.5" value="0" style="width:84px">
    <button class="btn tiny" id="eqreset" title="Listening only \u2014 changes nothing on disk. If every track sounds bassy it is the speakers; if one does it is the track.">FLAT</button>
    <span class="meta">VOL</span><input type="range" id="vol" min="0" max="1" step="0.01" value="0.75">
  </div>
  <nav id="tabs">
    <button data-tab="tracks" class="on">Tracks</button>
    <button data-tab="fx">Effects</button>
      <button data-tab="instruments">Instruments</button>
    <button data-tab="keys">Keyboard</button>
    <button data-tab="editor">Editor</button>
    <span class="sp"></span>
    <span id="qn"></span>
    <input id="q" type="search" placeholder="search" autocomplete="off" spellcheck="false">
  </nav>
</header>
<main id="main"></main>
</div>

<script type="module">
import { probeScore } from './core/probe.js';
import { quantise, toScore } from './core/record.js';
import * as ED from './core/edit.js';
import { loadScore } from './core/score.js';

// Both eras of the same thing are decoded and started together, sample
// aligned, and the A/B switch only moves gain between them. That is what makes
// the comparison honest: no reload, no restart, no drift, and the ear is
// comparing two timbres at the same instant in the same bar instead of
// comparing one timbre to its own memory four seconds ago.

const ERAS = ['8bit', '16bit'];
const ICON = {
  play: '<svg viewBox="0 0 16 16"><path d="M3 1.8v12.4L14 8z"/></svg>',
  pause: '<svg viewBox="0 0 16 16"><path d="M3 2h3.6v12H3zM9.4 2H13v12H9.4z"/></svg>',
  stop: '<svg viewBox="0 0 16 16"><path d="M2.6 2.6h10.8v10.8H2.6z"/></svg>',
  back: '<svg viewBox="0 0 16 16"><path d="M3 2h2v12H3zM14 2v12L5.6 8z"/></svg>',
  loop: '<svg viewBox="0 0 16 16"><path d="M4 3h7V.8L15.2 4 11 7.2V5H5v3.4L3 7V4a1 1 0 011-1zm8 10H5v2.2L.8 12 5 8.8V11h6V7.6L13 9v3a1 1 0 01-1 1z"/></svg>',
};
let ctx, master, era = '8bit', manifest = null;
let now = null;       // { sources, gains, buffers, startOffset, startedAt, dur, id }
let paused = false, pausedAt = 0, speed = 1, looping = false, nativeEra = null;
let probing = null;   // the instrument phrase currently sounding, if any
let raf = 0;

const $ = (s, r = document) => r.querySelector(s);

/**
 * Show failures instead of hanging.
 *
 * The previewer once sat on "rendering..." forever because a worker failed to
 * start and the rejection went into an async IIFE nobody was catching. A tool
 * that can fail silently will, and then the only symptom is that nothing
 * happens -- which is the least debuggable thing a program can do.
 */
const errBox = () => document.getElementById('err');
function fail(where, e) {
  const box = errBox();
  if (!box) return;
  const msg = (e && (e.message || e.reason?.message || e.reason || e)) || 'unknown';
  box.classList.add('on');
  box.innerHTML += `<button onclick="this.parentNode.classList.remove('on');this.parentNode.innerHTML=''">dismiss</button>`
    + `<b>${where}</b>\n${String(msg)}\n\n`;
  console.error(where, e);
}
addEventListener('error', (e) => fail('uncaught', e.error || e));
addEventListener('unhandledrejection', (e) => fail('unhandled promise rejection', e));
const el = (t, c, h) => { const n = document.createElement(t); if (c) n.className = c; if (h != null) n.innerHTML = h; return n; };
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const mmss = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

let bassEq = null, trebEq = null;
function audio() {
  if (!ctx) {
    // 44100 explicitly: core/dsp.js fixes the sample rate there, and a
    // context running at 48 kHz would make the worklet's idea of a second
    // disagree with the device's -- which detunes live playing by a tone.
    const AC = window.AudioContext || window.webkitAudioContext;
    try { ctx = new AC({ sampleRate: 44100, latencyHint: 'interactive' }); }
    catch { ctx = new AC(); }
    master = ctx.createGain();
    master.gain.value = +$('#vol').value;
    // A listening EQ, not a render setting. It sits after everything and
    // changes nothing on disk -- it is for answering "is this too bassy, or is
    // it my laptop", which is a question a preview tool should be able to
    // settle in two seconds. `--tilt` on render is the version that persists.
    bassEq = ctx.createBiquadFilter();
    bassEq.type = 'lowshelf'; bassEq.frequency.value = 200; bassEq.gain.value = +$('#bass').value;
    trebEq = ctx.createBiquadFilter();
    trebEq.type = 'highshelf'; trebEq.frequency.value = 3000; trebEq.gain.value = +$('#treb').value;
    master.connect(bassEq); bassEq.connect(trebEq); trebEq.connect(ctx.destination);
  }
  if (ctx.state !== 'running') ctx.resume();
  return ctx;
}

// --- rendering, in this tab -------------------------------------------------
//
// No server. The page loads the scores as TEXT and synthesises them here,
// using the same core/ modules the CLI imports -- so what you hear is what
// `sound render` writes, and the whole thing hosts on any static file server.
//
// A small pool of module workers does the work: rendering is CPU-bound and
// synchronous, so on the main thread it would freeze the page for the whole
// render AND make the two eras of an A/B queue behind each other.

const POOL_SIZE = Math.max(2, Math.min(4, (navigator.hardwareConcurrency || 4) - 1));
const pool = [];
const queue = [];
const pending = new Map();
let jobSeq = 0;

function pump() {
  while (queue.length) {
    const slot = pool.find((x) => !x.busy) || (pool.length < POOL_SIZE ? spawn() : null);
    if (!slot) return;
    const task = queue.shift();
    slot.busy = true;
    task.slot = slot;
    pending.set(task.job, task);
    slot.w.postMessage({ job: task.job, kind: task.kind, text: task.text, id: task.id, opts: task.opts });
  }
}

function spawn() {
  const w = new Worker('render-worker.js', { type: 'module' });
  const slot = { w, busy: false };
  w.onmessage = (ev) => {
    const m = ev.data;
    const task = pending.get(m.job);
    if (!task) return;
    if (m.type === 'progress') { task.onProgress?.(m.frac, m.peaks); return; }
    pending.delete(m.job);
    task.slot.busy = false;
    pump();
    if (m.type === 'error') task.reject(new Error(m.message));
    else task.resolve(m.wav);
  };
  w.onerror = (e) => {
    const why = e.message || `worker failed to load (${e.filename || 'render-worker.js'}:${e.lineno || '?'})`;
    fail('render worker', new Error(why));
    for (const [id, t] of pending) if (t.slot === slot) { pending.delete(id); t.reject(new Error(why)); }
    slot.busy = false;
  };
  w.onmessageerror = (e) => fail('worker message', new Error('could not deserialise a worker message'));
  pool.push(slot);
  return slot;
}

const runRender = (kind, text, id, opts, onProgress) => new Promise((resolve, reject) => {
  queue.push({ job: ++jobSeq, kind, text, id, opts, onProgress, resolve, reject });
  pump();
});

// --- live playing ------------------------------------------------------------
//
// An AudioWorklet running the same core/voice.js the renderer uses, so a note
// played here and the same note written into a score are the same samples.
// 128-sample blocks at 44.1 kHz put the floor on latency at 2.9 ms.

let live = null;          // the AudioWorkletNode
let liveReady = null;     // a promise, so several callers share one setup
let nextVoiceId = 1;

async function ensureLive() {
  if (live) return live;
  if (!liveReady) {
    liveReady = (async () => {
      const c = audio();
      await c.audioWorklet.addModule('live-worklet.js');
      const node = new AudioWorkletNode(c, 'live', { outputChannelCount: [2] });
      node.connect(master);
      live = node;
      return node;
    })().catch((e) => { liveReady = null; fail('starting the live engine', e); throw e; });
  }
  return liveReady;
}

const held = new Map();   // midi note -> voice id

async function noteOn(midi, inst, era, gain = 0.25) {
  const node = await ensureLive();
  if (held.has(midi)) noteOff(midi);
  const id = nextVoiceId += 1;
  held.set(midi, id);
  node.port.postMessage({ type: 'on', id, note: midi, inst, era, gain });
  rec.onNote(midi, true);
  return id;
}

function noteOff(midi) {
  const id = held.get(midi);
  if (id === undefined) return;
  held.delete(midi);
  live?.port.postMessage({ type: 'off', id });
  rec.onNote(midi, false);
}

function panic() {
  held.clear();
  live?.port.postMessage({ type: 'panic' });
}

// --- the recorder ------------------------------------------------------------

const rec = {
  armed: false, running: false, t0: 0, open: new Map(), events: [], onChange: null,
  start(when) { this.running = true; this.t0 = when; this.events = []; this.open.clear(); },
  stop() { 
    this.running = false;
    // Anything still held ends now rather than being discarded.
    for (const [note, start] of this.open) this.events.push({ note, start, end: ctx.currentTime - this.t0 });
    this.open.clear();
    this.onChange?.();
  },
  onNote(midi, down) {
    if (!this.running) return;
    const t = ctx.currentTime - this.t0;
    if (down) this.open.set(midi, Math.max(0, t));
    else if (this.open.has(midi)) {
      this.events.push({ note: midi, start: this.open.get(midi), end: t });
      this.open.delete(midi);
      this.onChange?.();
    }
  },
};

/** The metronome. Not an instrument -- a scheduled click, on the main thread. */
function click(at, accent) {
  const c = audio();
  const o = c.createOscillator();
  const g = c.createGain();
  o.frequency.value = accent ? 1600 : 1000;
  g.gain.setValueAtTime(accent ? 0.18 : 0.10, at);
  g.gain.exponentialRampToValueAtTime(0.0001, at + 0.045);
  o.connect(g); g.connect(master);
  o.start(at); o.stop(at + 0.06);
}

// --- the bar ----------------------------------------------------------------
//
// It is REAL: the renderer reports how far through it is and this draws that.
// A cost model built from note counts was tried first and came out 45% off in
// the median case, because vibrato makes a held note several times costlier
// per sample than a short one and counting notes cannot see that.

function setBar(frac, done) {
  const b = $('#load');
  if (done) {
    b.style.width = '100%';
    b.classList.remove('on');
    setTimeout(() => { if (!b.classList.contains('on')) b.style.width = '0'; }, 300);
    return;
  }
  b.classList.add('on');
  b.style.width = `${Math.max(2, Math.round(frac * 100))}%`;
}

const sourceOf = (kind, id) => (kind === 'fx'
  ? manifest.fx.find((x) => x.id === id)
  : manifest.tracks.find((x) => x.id === id))?.source;

const toOpts = (kind, p) => (kind === 'fx'
  ? {
    vary: p.seed !== undefined,
    seed: Number(p.seed ?? 1),
    maxLayers: p.layers === undefined ? null : Number(p.layers),
    soloLayer: p.solo === undefined ? null : Number(p.solo),
  }
  : {
    voice: p.voice ?? null,
    from: Number(p.from ?? 0),
    bars: p.bars === undefined ? null : Number(p.bars),
  });

const cache = new Map();
async function buffers(kind, id, params = {}, onProgress = null, rawText = null) {
  const key = `${kind}:${id}:${JSON.stringify(params)}`;
  if (cache.has(key)) return cache.get(key);

  const text = rawText || sourceOf(kind, id);
  const base = toOpts(kind, params);
  const parts = ERAS.map(() => 0);
  const peaks = ERAS.map(() => null);
  const report = () => {
    const f = parts.reduce((x, y) => x + y, 0) / parts.length;
    setBar(f);
    // Hand back the envelope for whichever era is selected, so the canvas
    // fills in with the audio actually being listened to.
    onProgress?.(f, peaks[ERAS.indexOf(era)] || peaks.find(Boolean) || null);
  };

  const p = Promise.all(ERAS.map(async (e, i) => {
    const ab = await runRender(kind, text, id, { ...base, era: e }, (f, pk) => {
      parts[i] = f;
      if (pk) peaks[i] = pk;
      report();
    });
    return audio().decodeAudioData(ab);
  })).then((r) => { setBar(1, true); onProgress?.(1, null); return r; },
    (e2) => { setBar(1, true); onProgress?.(1, null); throw e2; });

  cache.set(key, p);
  return p;
}

/** Where the playhead is, in buffer seconds. Survives pause and speed changes. */
function position() {
  if (!now || paused) return pausedAt;
  const p = now.startOffset + (ctx.currentTime - now.startedAt) * speed;
  return looping && now.dur ? p % now.dur : Math.min(p, now.dur);
}

/** Tear down the sources without forgetting where we were. */
function killSources() {
  if (!now) return;
  for (const st of now.stems) for (const s of st.sources) { try { s.onended = null; s.stop(); } catch {} }
  now.stems = [];
}

function stop() {
  if (probing) { try { probing.stop(); } catch {} probing = null; }
  killSources();
  now = null; paused = false; pausedAt = 0;
  cancelAnimationFrame(raf); raf = 0;
  document.querySelectorAll('.lit').forEach((n) => n.classList.remove('lit'));
  syncTransport();
}

function pause() {
  if (!now || paused) return;
  pausedAt = position();
  killSources();
  paused = true;
  cancelAnimationFrame(raf); raf = 0;
  syncTransport();
}

/**
 * Start a set of STEMS, all at once, sample aligned.
 *
 * A stem is one thing that can be heard on its own -- the full mix, or a
 * single voice. Each stem carries both eras, so the graph per stem is
 * source -> eraGain -> stemGain -> master: the era switch moves eraGain and
 * mute/solo moves stemGain, and the two never interfere. Everything starts at
 * the same offset with the same playbackRate, which is what keeps a four-voice
 * layer view locked together while you mute things in and out of it.
 */
function playStems(stems, id, offset = 0) {
  killSources();
  const c = audio();
  const at = c.currentTime + 0.05;
  const live = stems.map((st) => {
    const stemGain = c.createGain();
    stemGain.gain.value = stemLevel(st.id, stems);
    stemGain.connect(master);
    const sources = [], eraGains = [];
    st.bufs.forEach((b, i) => {
      const s = c.createBufferSource();
      s.buffer = b; s.playbackRate.value = speed; s.loop = looping;
      const g = c.createGain();
      g.gain.value = ERAS[i] === era ? 1 : 0;
      s.connect(g); g.connect(stemGain);
      s.start(at, offset % b.duration);
      sources.push(s); eraGains.push(g);
    });
    return { id: st.id, sources, eraGains, stemGain };
  });
  now = {
    stems: live, buffers: stems[0].bufs, startOffset: offset, startedAt: at,
    dur: stems[0].bufs[0].duration, id,
  };
  paused = false;
  live[0].sources[0].onended = () => { if (now && now.stems[0]?.sources[0] === live[0].sources[0]) stop(); };
  syncTransport();
  return now;
}

const mutes = new Set(), solos = new Set();
/** Solo wins over mute, and soloing anything silences everything unsoloed. */
function stemLevel(id) {
  if (id === '#mix') return 1;
  if (solos.size) return solos.has(id) ? 1 : 0;
  return mutes.has(id) ? 0 : 1;
}
function applyStemLevels() {
  if (!now) return;
  for (const st of now.stems) {
    st.stemGain.gain.setTargetAtTime(stemLevel(st.id), ctx.currentTime, 0.015);
  }
}

function setSpeed(v) {
  if (now && !paused) { now.startOffset = position(); now.startedAt = ctx.currentTime; }
  speed = v;
  if (now) for (const st of now.stems) for (const s of st.sources) s.playbackRate.value = speed;
  const l = $('#speedval'); if (l) l.textContent = `${speed.toFixed(2)}x`;
  const r = $('#speed'); if (r) r.value = String(speed);
}

function setLoop(on) {
  looping = on;
  if (now) for (const st of now.stems) for (const s of st.sources) s.loop = looping;
  syncTransport();
}

function setEra(e) {
  era = e;
  document.querySelectorAll('#era button').forEach((b) => b.classList.toggle('on', b.dataset.era === e));
  if (now) {
    // A short ramp, not a jump: a hard gain switch clicks, and the click is
    // the loudest thing in the comparison.
    for (const st of now.stems) {
      st.eraGains.forEach((g, i) => g.gain.setTargetAtTime(ERAS[i] === era ? 1 : 0, ctx.currentTime, 0.012));
    }
  }
  markNative();
  if (tab !== 'tracks') render();
  else if (!now) render();
}

/**
 * Say which era the selected track was WRITTEN for.
 *
 * This is the confusion the first version caused: a track's header said
 * "written for 16bit" while the toggle sat on 8-BIT, and nothing connected the
 * two. Now selecting a track moves the toggle to its native era, and the
 * toggle itself says which one that is.
 */
function markNative() {
  document.querySelectorAll('#era button').forEach((b) => {
    const i = b.querySelector('i');
    if (i) i.textContent = (b.dataset.era === nativeEra) ? 'AS WRITTEN' : '';
  });
  const n = $('#eranote');
  if (n) {
    n.textContent = !nativeEra ? ''
      : era === nativeEra ? 'hearing it as written'
        : `substituted \u2014 written for ${nativeEra}`;
    n.style.color = (nativeEra && era !== nativeEra) ? 'var(--a)' : 'var(--dimmer)';
  }
}

/** One place that makes the buttons agree with the actual state. */
function syncTransport() {
  const p = $('#bplay'), st = $('#bstop'), lp = $('#bloop'), bk = $('#bback');
  if (!p) return;
  const live = !!now && !paused;
  p.innerHTML = live ? ICON.pause : ICON.play;
  p.title = live ? 'Pause (space)' : 'Play (space)';
  if (st) st.disabled = !now && !paused && !pausedAt;
  if (bk) bk.disabled = !now && !paused && !pausedAt;
  lp?.classList.toggle('on', looping);
}

// ------------------------------------------------------------------ tracks --

function drawWave(cv, buf, pos, alpha = 1) {
  const dpr = Math.min(2, devicePixelRatio || 1);
  const w = cv.clientWidth, h = cv.clientHeight;
  cv.width = w * dpr; cv.height = h * dpr;
  const g = cv.getContext('2d'); g.scale(dpr, dpr);
  g.clearRect(0, 0, w, h);
  const d = buf.getChannelData(0), step = Math.max(1, Math.floor(d.length / w));
  g.strokeStyle = era === '8bit' ? '#ffb74d' : '#6fe6ff';
  g.globalAlpha = 0.85 * alpha; g.lineWidth = 1;
  g.beginPath();
  for (let x = 0; x < w; x++) {
    let lo = 1, hi = -1;
    for (let i = 0; i < step; i++) { const v = d[x * step + i] || 0; if (v < lo) lo = v; if (v > hi) hi = v; }
    g.moveTo(x + 0.5, h / 2 - hi * h * 0.46);
    g.lineTo(x + 0.5, h / 2 - lo * h * 0.46);
  }
  g.stroke();
  if (pos != null) {
    g.globalAlpha = Math.max(0.5, alpha); g.fillStyle = '#fff';
    g.fillRect(Math.round(pos * w), 0, 1.5, h);
  }
}

/**
 * The load state, drawn where the waveform will be.
 *
 * A percentage in the corner of a transport row is easy to miss; this puts it
 * in the panel you are already looking at, and fills in the envelope as the
 * renderer produces it, so the thing you are waiting for is also the thing
 * showing you the wait.
 */
function drawLoading(cv, frac, peaks, label) {
  const dpr = Math.min(2, devicePixelRatio || 1);
  const w = cv.clientWidth, h = cv.clientHeight;
  cv.width = w * dpr; cv.height = h * dpr;
  const g = cv.getContext('2d');
  g.scale(dpr, dpr);
  g.clearRect(0, 0, w, h);
  const col = era === '8bit' ? '#ffb74d' : '#6fe6ff';

  if (peaks) {
    const n = peaks.length / 2;
    g.strokeStyle = col;
    g.globalAlpha = 0.34;
    g.lineWidth = 1;
    g.beginPath();
    for (let x = 0; x < w; x++) {
      const b = Math.min(n - 1, Math.floor((x / w) * n));
      g.moveTo(x + 0.5, h / 2 - peaks[b * 2 + 1] * h * 0.46);
      g.lineTo(x + 0.5, h / 2 - peaks[b * 2] * h * 0.46);
    }
    g.stroke();
  }

  g.globalAlpha = 1;
  g.fillStyle = col;
  g.fillRect(0, h - 3, w * frac, 3);

  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillStyle = col;
  g.font = `600 ${Math.min(46, Math.round(h * 0.52))}px ui-monospace,SFMono-Regular,Menlo,monospace`;
  g.fillText(`${Math.round(frac * 100)}%`, w / 2, h / 2 - 6);
  if (label) {
    g.fillStyle = '#8b9aa7';
    g.font = '10px ui-monospace,SFMono-Regular,Menlo,monospace';
    g.fillText(label, w / 2, h / 2 + 20);
  }
}

function trackView(t) {
  const c = el('div', 'card');
  c.append(el('h2', null, esc(t.name)));
  c.append(el('div', 'meta', `${t.bpm} BPM · ${t.beats} steps/bar · ${t.bars} bars · ${t.seconds}s · `
    + `${t.voices.length} voices · written for ${t.era} · ${esc(t.tags.join(' '))}`));

  if (t.blurb.length) {
    const bl = el('div', 'blurb clip', esc(t.blurb.join('\n')));
    const more = el('button', 'more', 'show all ▾');
    more.onclick = () => {
      const open = bl.classList.toggle('clip');
      more.textContent = open ? 'show all ▾' : 'show less ▴';
    };
    c.append(bl, more);
  }

  const barDur = (t.beats * 60) / t.bpm / 4;
  // A window big enough to hear a phrase, small enough that N voices x 2 eras
  // is not a hundred megabytes of decoded audio.
  const winBars = Math.max(2, Math.min(8, Math.round(20 / barDur)));

  let mixBufs = null;            // the full track, both eras
  let layer = null;              // { from, bars, voices:[{id,bufs}] } when open

  const stems = () => (layer
    ? layer.voices.map((v) => ({ id: v.id, bufs: v.bufs }))
    : [{ id: '#mix', bufs: mixBufs }]);
  const current = () => (layer ? layer.voices[0].bufs : mixBufs);

  const cv = el('canvas'); cv.classList.add('pending'); c.append(cv);

  // --- transport -----------------------------------------------------------
  const tr = el('div', 'transport');
  const keys = el('div', 'keys');
  const bBack = el('button', null, ICON.back); bBack.id = 'bback'; bBack.title = 'Back to start';
  const bPlay = el('button', null, ICON.play); bPlay.id = 'bplay';
  const bStop = el('button', null, ICON.stop); bStop.id = 'bstop'; bStop.title = 'Stop';
  keys.append(bBack, bPlay, bStop);
  const time = el('div', 'time', '–:–– / –:––');
  const barno = el('div', 'barno', '');
  const bLoop = el('button', 'loopbtn', 'LOOP'); bLoop.id = 'bloop'; bLoop.title = 'Loop (L)';
  const sp = el('div', 'speed');
  const spIn = el('input'); spIn.type = 'range'; spIn.id = 'speed';
  spIn.min = '0.25'; spIn.max = '2'; spIn.step = '0.05'; spIn.value = String(speed);
  const spVal = el('div', 'v', `${speed.toFixed(2)}x`); spVal.id = 'speedval';
  const spReset = el('button', null, 'reset');
  sp.append(el('label', null, 'SPEED'), spIn, spVal, spReset);
  tr.append(keys, time, barno, bLoop, sp);
  c.append(tr);
  const hint = el('div', 'hint',
    'space play/pause · 1 and 2 switch era · L loop · click the waveform to seek. '
    + 'Speed resamples, so pitch moves with tempo. For tempo alone: sound play <track> --bpm 90');
  c.append(hint);

  // --- the layer visualiser ------------------------------------------------
  const ph = el('div', 'panelhead');
  ph.append(el('h3', null, 'Layers'));
  const bOpen = el('button', 'btn tiny', 'SHOW LAYERS');
  const winLabel = el('span', 'meta', '');
  const bPrev = el('button', 'btn tiny', '◀'); bPrev.hidden = true;
  const bNext = el('button', 'btn tiny', '▶'); bNext.hidden = true;
  ph.append(bOpen, bPrev, winLabel, bNext);
  c.append(ph);
  const lanesBox = el('div');
  c.append(lanesBox);

  const laneCanvases = new Map();
  const isSilent = (b) => {
    const d = b.getChannelData(0);
    for (let i = 0; i < d.length; i += 64) if (Math.abs(d[i]) > 0.0008) return false;
    return true;
  };

  function drawLanes(pos) {
    for (const [id, cvv] of laneCanvases) {
      const v = layer?.voices.find((x) => x.id === id);
      if (!v) continue;
      drawWave(cvv, v.bufs[ERAS.indexOf(era)], pos, stemLevel(id) === 0 ? 0.25 : 1);
    }
  }

  function buildLanes() {
    lanesBox.innerHTML = '';
    laneCanvases.clear();
    const box = el('div', 'lanes');
    for (const v of t.voices) {
      const row = el('div', 'lane');
      const nm = el('div', 'nm', `${esc(v.id)}<small>${esc(v.inst)}</small>`);
      const ms = el('div', 'ms');
      const m = el('button', 'm', 'M'); m.title = 'Mute';
      const so = el('button', 's', 'S'); so.title = 'Solo';
      m.onclick = () => {
        mutes.has(v.id) ? mutes.delete(v.id) : mutes.add(v.id);
        applyStemLevels(); refreshLaneState();
      };
      so.onclick = () => {
        solos.has(v.id) ? solos.delete(v.id) : solos.add(v.id);
        applyStemLevels(); refreshLaneState();
      };
      ms.append(m, so);
      const lc = el('canvas');
      laneCanvases.set(v.id, lc);
      const buf = layer?.voices.find((x) => x.id === v.id)?.bufs[0];
      const silent = buf ? isSilent(buf) : false;
      const lvl = el('div', 'lvl', silent ? 'tacet' : String(v.mix));
      if (silent) {
        row.classList.add('off');
        nm.innerHTML = `${esc(v.id)}<small>not in these bars</small>`;
      }
      row.append(nm, ms, lc, lvl);
      row.dataset.voice = v.id;
      row._m = m; row._s = so;
      box.append(row);
    }
    lanesBox.append(box);
    lanesBox.append(el('div', 'hint',
      'M mutes, S solos. Lanes are rendered at their real level in the mix — a quiet '
      + 'pad looks quiet, because that is the thing worth seeing.'));
    refreshLaneState();
  }

  function refreshLaneState() {
    for (const row of lanesBox.querySelectorAll('.lane')) {
      const id = row.dataset.voice;
      row._m.classList.toggle('on', mutes.has(id));
      row._s.classList.toggle('on', solos.has(id));
      row.classList.toggle('off', stemLevel(id) === 0);
    }
    drawLanes(now || paused ? position() / (now?.dur || 1) : null);
  }

  async function openLayers(from = 0) {
    bOpen.textContent = 'LOADING…';
    bOpen.disabled = true;
    lanesBox.innerHTML = '';
    const wait = el('div', 'loading');
    wait.append(el('div', 'spin'), el('span', null,
      `bars ${from + 1}–${Math.min(t.bars, from + winBars)} · ${t.voices.length} voices × 2 eras`));
    lanesBox.append(wait);
    const got = await Promise.all(t.voices.map(async (v) => ({
      id: v.id,
      bufs: await buffers('track', t.id, { voice: v.id, bars: String(from + winBars) }),
    })));
    layer = { from, bars: winBars, voices: got };
    bOpen.textContent = 'HIDE LAYERS';
    bOpen.disabled = false;
    bPrev.hidden = bNext.hidden = false;
    winLabel.textContent = `bars 1–${Math.min(t.bars, from + winBars)}`;
    buildLanes();
    if (now || paused) start(Math.min(position(), current()[0].duration - 0.05));
    else paint();
  }

  function closeLayers() {
    const was = !!now;
    layer = null;
    lanesBox.innerHTML = '';
    laneCanvases.clear();
    bOpen.textContent = 'SHOW LAYERS';
    bPrev.hidden = bNext.hidden = true;
    winLabel.textContent = '';
    if (was) start(0); else { stop(); paint(); }
  }

  bOpen.onclick = () => (layer ? closeLayers() : openLayers(0));
  bNext.onclick = () => openLayers(Math.min(Math.max(0, t.bars - winBars), layer.from + winBars));
  bPrev.onclick = () => openLayers(Math.max(0, layer.from - winBars));

  // --- painting ------------------------------------------------------------
  const paint = () => {
    const set = current() || now?.buffers;
    if (!set) return;
    cv.classList.remove('pending');
    const pos = position();
    const dur = now?.dur || set[0].duration;
    const frac = (now || paused) ? pos / dur : null;
    drawWave(cv, set[ERAS.indexOf(era)], frac);
    time.textContent = `${mmss(pos)} / ${mmss(dur)}`;
    barno.textContent = layer
      ? `bar ${layer.from + Math.floor(pos / barDur) + 1}/${t.bars}`
      : `bar ${Math.min(t.bars, Math.floor(pos / barDur) + 1)}/${t.bars}`;
    if (layer) drawLanes(frac);
  };
  const tick = () => {
    if (!now || paused) { raf = 0; return; }
    paint();
    raf = requestAnimationFrame(tick);
  };

  const start = async (offset = 0) => {
    if (!mixBufs) mixBufs = await buffers('track', t.id);
    playStems(stems(), t.id, offset);
    cancelAnimationFrame(raf); tick();
  };

  bPlay.onclick = () => {
    if (now && !paused) { pause(); paint(); return; }
    start(paused ? pausedAt : 0);
  };
  bStop.onclick = () => { stop(); paint(); };
  bBack.onclick = () => { if (now || paused) start(0); else { pausedAt = 0; paint(); } };
  bLoop.onclick = () => setLoop(!looping);
  spIn.oninput = (e) => setSpeed(+e.target.value);
  spReset.onclick = () => setSpeed(1);
  cv.onclick = (e) => {
    const set = current();
    if (!set) return;
    const off = (e.offsetX / cv.clientWidth) * set[0].duration;
    if (now && !paused) start(off);
    else { pausedAt = off; paint(); syncTransport(); }
  };

  (async () => {
    bPlay.disabled = true;
    const started = Date.now();
    try {
      mixBufs = await buffers('track', t.id, {}, (frac, peaks) => {
        if (frac >= 1) { time.textContent = '0:00 / 0:00'; barno.textContent = ''; return; }
        time.textContent = '';
        barno.textContent = '';
        drawLoading(cv, frac, peaks,
          `${t.seconds}s · 8-bit + 16-bit · ${((Date.now() - started) / 1000).toFixed(1)}s`);
      });
    } catch (e) {
      time.textContent = 'failed';
      barno.textContent = '';
      fail(`rendering ${t.name}`, e);
      return;
    }
    bPlay.disabled = false;
    syncTransport();
    paint();
  })();

  const tbl = el('table');
  tbl.innerHTML = '<tr><th>voice</th><th>instrument</th><th>on 8-bit</th><th>on 16-bit</th><th>mix</th><th>pan</th></tr>';
  for (const v of t.voices) {
    const sub = (e) => {
      const i = manifest.instruments.find((x) => x.name === v.inst);
      if (!i) return '?';
      if (i.era === e) return `<span class="n">${v.inst}</span>`;
      const x = manifest.substitute[e]?.[v.inst];
      return x ? `<span class="swap">${x}</span>` : `<span class="n">${v.inst}</span>`;
    };
    tbl.append(el('tr', null, `<td>${esc(v.id)}</td><td>${esc(v.inst)}</td>`
      + `<td>${sub('8bit')}</td><td>${sub('16bit')}</td>`
      + `<td class="n">${v.mix}</td><td class="n">${v.pan || 0}</td>`));
  }
  c.append(tbl);

  const d = el('details');
  d.append(el('summary', null, `tracks/${t.id}.snd — the whole score, as text`));
  d.append(el('pre', null, esc(t.source)));
  c.append(d);
  return c;
}

// Tracker layout: two rows of the computer keyboard are two octaves, which is
// what every chip tracker has used since Protracker.
//
//   Q 2 W 3 E R 5 T 6 Y 7 U    upper octave
//   Z S X D C V G B H N J M    lower octave
//
// Keyed on `code`, the PHYSICAL key, so the shape stays under the same fingers
// on AZERTY and Dvorak. Keying on the character would scramble it.
const KEYMAP = {
  KeyZ: 0, KeyS: 1, KeyX: 2, KeyD: 3, KeyC: 4, KeyV: 5,
  KeyG: 6, KeyB: 7, KeyH: 8, KeyN: 9, KeyJ: 10, KeyM: 11,
  KeyQ: 12, Digit2: 13, KeyW: 14, Digit3: 15, KeyE: 16, KeyR: 17,
  Digit5: 18, KeyT: 19, Digit6: 20, KeyY: 21, Digit7: 22, KeyU: 23,
};
const semiFor = (ev) => KEYMAP[ev.code] ?? KEYMAP[`Key${(ev.key || '').toUpperCase()}`]
  ?? KEYMAP[`Digit${ev.key}`];
const KEYLABEL = Object.fromEntries(Object.entries(KEYMAP)
  .map(([k, v]) => [v, k.replace(/^Key|^Digit/, '')]));
const WHITE_PC = [0, 2, 4, 5, 7, 9, 11];
const BLACK_OFF = { 1: 0.68, 3: 1.68, 6: 3.68, 8: 4.68, 10: 5.68 };

let takeBpm = 104;
let takeGrid = 1;

function litKey(semi, on) {

}

/**
 * Tempi that fit what was played.
 *
 * Returns candidates, not an answer, because there is no answer. Eighth notes
 * at 120 and sixteenth notes at 60 are the same performance -- the onsets are
 * identical and nothing in them says which one you meant. Any detector that
 * returns a single number is guessing, and on a spread of test takes the
 * obvious scoring picked half-time four times out of six.
 *
 * So: take the median gap between notes, treat it as each plausible
 * subdivision of a beat, keep the tempi that land in a range people play in,
 * and let the person choose. Ordered by closeness to 110 BPM, which is only a
 * starting guess and is labelled as one.
 */
function fitCandidates(events) {
  const onsets = [...new Set(events.map((e) => Math.round(e.start * 1000) / 1000))]
    .filter((t) => t >= 0).sort((a, b) => a - b);
  if (onsets.length < 4) return [];
  const gaps = [];
  for (let i = 1; i < onsets.length; i++) {
    const g = onsets[i] - onsets[i - 1];
    if (g > 0.05) gaps.push(g);
  }
  if (gaps.length < 3) return [];
  gaps.sort((a, b) => a - b);
  const med = gaps[gaps.length >> 1];

  const out = [];
  for (const mult of [0.5, 1, 2, 3, 4, 6, 8]) {
    const bpm = Math.round(60 / (med * mult));
    if (bpm < 55 || bpm > 200) continue;
    if (out.some((b) => Math.abs(b - bpm) < 3)) continue;
    out.push(bpm);
  }
  return out.sort((a, b) => Math.abs(Math.log2(a / 110)) - Math.abs(Math.log2(b / 110)));
}

  metro.onclick = () => { metroOn = !metroOn; metro.classList.toggle('on', metroOn); };

  metro.addEventListener('click', showClickOpts);
  countIn.onchange = showClickOpts;

  // --- the keys ------------------------------------------------------------
  const kb = el('div', 'kb');

            `take-${takeInst}-${takeBpm}-${takeGrid}-${mixIn.value}-${rec.events.length}`, {}, null, text);
          const n2 = audio().createBufferSource();
          n2.buffer = bufs[ERAS.indexOf(tEra)];
          n2.connect(master); n2.start();
        } catch (e) { fail('playing the score', e); }
      };
      const copy = el('button', 'btn tiny', 'COPY');
      copy.onclick = () => { navigator.clipboard?.writeText(text); copy.textContent = 'COPIED'; setTimeout(() => { copy.textContent = 'COPY'; }, 1200); };
      const dl = el('button', 'btn tiny', 'DOWNLOAD');
      dl.onclick = () => {
        const a2 = document.createElement('a');
        a2.href = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));
        a2.download = `${nameIn.value || 'take'}.snd`;
        a2.click();
      };
      // Save into tracks/, so a take joins the library instead of sitting in a
      // downloads folder. Only works against the local server; a static host
      // has no filesystem and the download is the fallback.
      const save = el('button', 'btn tiny', 'SAVE TO TRACKS');
      save.onclick = async () => {
        const id = (nameIn.value || '').trim();
        if (!id) { saveMsg.textContent = 'Give it a name first.'; nameIn.focus(); return; }
        save.disabled = true;
        saveMsg.textContent = 'saving\u2026';
        // The id and the display name both come from the box, so a saved take
        // does not show up in the track list still called TAKE.
        const named = text
          .replace('@track take', `@track ${id}`)
          .replace(/^ {2}name {3}TAKE$/m, `  name   ${id.replace(/-/g, ' ').toUpperCase()}`);
        try {
          let r = await fetch('/api/save', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ id, text: named }),
          });
          if (r.status === 409) {
            if (!confirm(`tracks/${id}.snd exists. Overwrite it?`)) { saveMsg.textContent = ''; return; }
            r = await fetch('/api/save', {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ id, text: named, overwrite: true }),
            });
          }
          if (!r.ok) { saveMsg.textContent = await r.text(); return; }
          const { path } = await r.json();
          saveMsg.innerHTML = `saved to <b>${esc(path)}</b> \u2014 it is in the Tracks tab now`;
          manifest = await (await fetch(`data.json?t=${Date.now()}`)).json();
          manifest.substitute = manifest.substituteTable;
        } catch {
          saveMsg.textContent = 'No local server, so use DOWNLOAD and put the file in tracks/.';
        } finally { save.disabled = false; }
      };
      bar.append(hear, copy, save, dl, nameIn);
      bar.append(saveMsg);
      out.append(bar, el('pre', null, esc(text)));
    };
    bpm.oninput = build;
    grid.onchange = build;
    instSel2.onchange = build;
    mixIn.oninput = build;
    let fitAt = 0;
    fit.onclick = () => {
      const cands = fitCandidates(rec.events);
      if (!cands.length) { note.textContent = 'No steady pulse in that take to fit to.'; return; }
      bpm.value = String(cands[fitAt % cands.length]);
      fitAt += 1;
      build();
    };
    build();
  };

  recBtn.onclick = async () => {
    if (rec.running) {
      rec.stop();
      recBtn.classList.remove('on');
      recBtn.textContent = '● REC';
      showTake();
      return;
    }
    await ensureLive();
    const c2 = audio();
    const beat = 60 / +clickBpm.value;
    const bars = +countIn.value;
    const at = c2.currentTime + 0.12;
    if (metroOn || bars) {
      for (let i = 0; i < (bars || 0) * 4; i++) click(at + i * beat, i % 4 === 0);
    }
    const startAt = at + bars * 4 * beat;
    if (metroOn) for (let i = 0; i < 64; i++) click(startAt + i * beat, i % 4 === 0);
    recBtn.classList.add('on');
    recBtn.textContent = '■ STOP';
    stat.textContent = bars ? `Count-in… ${bars} bar${bars > 1 ? 's' : ''}` : 'Recording.';
    setTimeout(() => {
      rec.start(startAt);
      stat.textContent = 'Recording. Play something, then press STOP.';
    }, Math.max(0, (startAt - c2.currentTime) * 1000));
  };

  // --- MIDI ----------------------------------------------------------------
  if (navigator.requestMIDIAccess) {
    navigator.requestMIDIAccess().then((acc) => {
      midiAccess = acc;
      const fill = () => {
        const cur = midiSel.value;
        midiSel.innerHTML = '';
        midiSel.append(Object.assign(el('option', null, 'MIDI: none'), { value: '' }));
        for (const inp of acc.inputs.values()) {
          const o = el('option', null, `MIDI: ${inp.name}`);
          o.value = inp.id;
          if (inp.id === cur) o.selected = true;
          midiSel.append(o);
        }
        if (acc.inputs.size === 0) midiSel.firstChild.textContent = 'MIDI: no devices';
      };
      fill();
      acc.onstatechange = fill;
    }).catch(() => { midiSel.firstChild.textContent = 'MIDI: blocked'; });
  } else {
    midiSel.firstChild.textContent = 'MIDI: unsupported';
    midiSel.disabled = true;
  }

  return c;
}

/** Route a MIDI device's notes into the same path the keys use. */
function attachMidi(id) {
  if (midiInput) midiInput.onmidimessage = null;
  midiInput = null;
  if (!id || !midiAccess) return;
  for (const inp of midiAccess.inputs.values()) {
    if (inp.id !== id) continue;
    midiInput = inp;
    inp.onmidimessage = (ev) => {
      const [status, note, vel] = ev.data;
      const kind = status & 0xf0;
      // A note-on with velocity 0 is a note-off. Every controller does this
      // and forgetting it leaves notes stuck down forever.
      if (kind === 0x90 && vel > 0) {
        noteOn(note, kbInst, manifest.instruments.find((i) => i.name === kbInst)?.era || '8bit',
          0.08 + (vel / 127) * 0.28);
        litKey(note - (kbOctave * 12 + 12), true);
      } else if (kind === 0x80 || (kind === 0x90 && vel === 0)) {
        noteOff(note);
        litKey(note - (kbOctave * 12 + 12), false);
      } else if (kind === 0xb0 && note === 123) {
        panic();
      }
    };
  }
}

let kbPlay = null, kbStop = null;
const kbDown = new Set();

// ----------------------------------------------------------------- editor --
//
// Named the way editing software is named, because those words are what
// anybody arriving here already knows:
//
//   track      one instrument's part. A `@voice` in the file.
//   arm        which track a recording goes into.
//   overdub    record a new track while the others play.
//   playhead   where you are.
//   selection  a span of bars, which is what insert and delete act on.
//
// A piano roll rather than a step grid: the score IS a step grid, and drawing
// it as one makes pitch invisible. Canvas rather than elements because
// SCRAMBLE is 1875 notes and 1875 divs is a slideshow.

let edSong = null;      // the model being edited
let edTrack = null;     // selected track id
let edArmed = null;     // track that recording goes into
let edSel = null;       // { from, to } in bars
let edDirty = false;
const edMute = new Set();
const edSolo = new Set();
let edPlay = null;      // { src, startedAt }

const ROW_H = 9;
const STEP_W = 13;

function edPitchRange(m) {
  const all = m.voices.flatMap((v) => v.notes.map((n) => n.midi)).filter((x) => x != null);
  if (!all.length) return [48, 84];
  return [Math.min(...all) - 2, Math.max(...all) + 3];
}

function drawRoll(cv, m) {
  const [lo, hi] = edPitchRange(m);
  const rows = hi - lo + 1;
  const steps = m.bars * m.beats;
  const w = steps * STEP_W;
  const h = rows * ROW_H;
  const dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = w * dpr; cv.height = h * dpr;
  cv.style.width = `${w}px`; cv.style.height = `${h}px`;
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);

  // black-key rows, so pitch is readable without a keyboard down the side
  for (let r = 0; r < rows; r++) {
    const pc = (hi - r) % 12;
    if ([1, 3, 6, 8, 10].includes(((pc % 12) + 12) % 12)) {
      g.fillStyle = '#0e1318'; g.fillRect(0, r * ROW_H, w, ROW_H);
    }
  }
  // selection behind everything
  if (edSel) {
    g.fillStyle = 'rgba(111,230,255,.12)';
    g.fillRect(edSel.from * m.beats * STEP_W, 0, (edSel.to - edSel.from) * m.beats * STEP_W, h);
  }
  // beat and bar lines
  for (let st = 0; st <= steps; st++) {
    const x = st * STEP_W;
    const bar = st % m.beats === 0;
    g.strokeStyle = bar ? '#2b3640' : '#151b21';
    g.lineWidth = 1;
    g.beginPath(); g.moveTo(x + 0.5, 0); g.lineTo(x + 0.5, h); g.stroke();
  }
  for (let r = 0; r <= rows; r++) {
    g.strokeStyle = '#121820';
    g.beginPath(); g.moveTo(0, r * ROW_H + 0.5); g.lineTo(w, r * ROW_H + 0.5); g.stroke();
  }

  // other tracks as ghosts, so you can see what you are playing against
  for (const v of m.voices) {
    if (v.id === edTrack || v.kind === 'drum' || v.kind === 'chord') continue;
    g.fillStyle = 'rgba(139,154,167,.20)';
    for (const n of v.notes) {
      if (n.midi == null) continue;
      g.fillRect(n.step * STEP_W + 1, (hi - n.midi) * ROW_H + 1, n.len * STEP_W - 2, ROW_H - 2);
    }
  }
  // the selected track
  const v = m.voices.find((x) => x.id === edTrack);
  if (v) {
    for (const n of v.notes) {
      const y = n.midi != null ? (hi - n.midi) * ROW_H : h - ROW_H;
      g.fillStyle = era === '8bit' ? '#ffb74d' : '#6fe6ff';
      g.fillRect(n.step * STEP_W + 1, y + 1, n.len * STEP_W - 2, ROW_H - 2);
      g.fillStyle = 'rgba(0,0,0,.45)';
      g.fillRect((n.step + n.len) * STEP_W - 3, y + 1, 2, ROW_H - 2);
    }
  }
  // playhead
  if (edPlay) {
    const t = (ctx.currentTime - edPlay.startedAt);
    const st = t / (60 / m.bpm / 4);
    if (st >= 0 && st <= steps) {
      g.fillStyle = '#fff';
      g.fillRect(st * STEP_W, 0, 1.5, h);
    }
  }
}

function edStopPlay() {
  if (edPlay) { try { edPlay.src.stop(); } catch {} edPlay = null; }
}

async function edRender(m) {
  const text = ED.toText(m);
  const bufs = await buffers('track', `ed-${m.id}-${edDirty}-${Date.now()}`, {}, null, text);
  return bufs[ERAS.indexOf(m.era)];
}


function editorView() {
  const c = el('div', 'card');
  c.append(el('h2', null, 'Editor'));

  // --- which song ----------------------------------------------------------
  const top = el('div', 'edbar');
  const songSel = el('select');
  for (const t of manifest.tracks) {
    const o = el('option', null, `${t.name}${t.shipped ? '' : '  (yours)'}`);
    o.value = t.id;
    if (edSong && t.id === edSong.id) o.selected = true;
    songSel.append(o);
  }
  const openSong = (id) => {
    const t = manifest.tracks.find((x) => x.id === id);
    if (!t) return;
    edStopPlay();
    edSong = ED.toModel(loadScore(t.source, `${id}.snd`));
    edTrack = edSong.voices[0]?.id ?? null;
    edArmed = null; edSel = null; edDirty = false;
    edMute.clear(); edSolo.clear();
    era = edSong.era;
    render();
  };
  songSel.onchange = () => openSong(songSel.value);
  const saveBtn = el('button', 'btn tiny', 'SAVE');
  const saveMsg = el('span', 'meta', '');
  top.append(el('span', 'meta', 'SONG'), songSel, saveBtn, saveMsg, el('span', 'sp'));
  c.append(top);

  if (!edSong) {
    openSong(manifest.tracks[0]?.id);
    c.append(el('div', 'meta', 'Loading…'));
    return c;
  }
  const m = edSong;
  top.append(el('span', 'meta',
    `${m.bars} bars · ${m.beats}/bar · ${m.bpm} BPM · ${m.era}${edDirty ? ' · unsaved' : ''}`));
  if (m.wasSectioned) {
    c.append(el('div', 'note',
      'This song was written with sections and an order. The editor has flattened it into one '
      + 'timeline, so saving will replace the arrangement with its played-out form.'));
  }

  saveBtn.onclick = async () => {
    const id = m.id;
    saveMsg.textContent = 'saving…';
    try {
      const r = await fetch('/api/save', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ id, text: ED.toText(m), overwrite: true }),
      });
      if (!r.ok) { saveMsg.textContent = await r.text(); return; }
      edDirty = false;
      saveMsg.innerHTML = `saved to <b>tracks/${esc(id)}.snd</b>`;
      manifest = await (await fetch(`data.json?t=${Date.now()}`)).json();
      manifest.substitute = manifest.substituteTable;
    } catch { saveMsg.textContent = 'No local server — editing works, saving needs one.'; }
  };

  // --- tracks --------------------------------------------------------------
  const grid = el('div', 'ed');
  const trk = el('div', 'trk');
  for (const v of m.voices) {
    const row = el('div', `row${v.id === edTrack ? ' sel' : ''}${v.id === edArmed ? ' armed' : ''}`);
    row.append(el('div', 'nm', `${esc(v.id)}<small>${esc(v.inst)} · mix ${v.mix}</small>`));
    const btns = el('div', 'btns');
    const arm = el('button', `a${v.id === edArmed ? ' on' : ''}`, '●');
    arm.title = 'Arm: recording goes into this track';
    const mu = el('button', `m${edMute.has(v.id) ? ' on' : ''}`, 'M');
    const so = el('button', `s${edSolo.has(v.id) ? ' on' : ''}`, 'S');
    arm.onclick = (e) => { e.stopPropagation(); edArmed = edArmed === v.id ? null : v.id; render(); };
    mu.onclick = (e) => { e.stopPropagation(); edMute.has(v.id) ? edMute.delete(v.id) : edMute.add(v.id); render(); };
    so.onclick = (e) => { e.stopPropagation(); edSolo.has(v.id) ? edSolo.delete(v.id) : edSolo.add(v.id); render(); };
    btns.append(arm, mu, so);
    row.append(btns);
    row.onclick = () => { edTrack = v.id; render(); };
    trk.append(row);
  }
  const addRow = el('div', 'row');
  addRow.append(el('div', 'nm', '+ new track'));
  addRow.onclick = () => {
    ED.addVoice(m, { id: 'part', inst: kbInst, mix: 0.2 });
    edTrack = m.voices[m.voices.length - 1].id;
    edArmed = edTrack;
    edDirty = true;
    render();
  };
  trk.append(addRow);
  grid.append(trk);

  // --- the roll ------------------------------------------------------------
  const rollBox = el('div', 'roll');
  const cv = el('canvas');
  rollBox.append(cv);
  grid.append(rollBox);
  c.append(grid);

  const [lo, hi] = edPitchRange(m);
  const at = (ev) => {
    const r = cv.getBoundingClientRect();
    return {
      step: Math.max(0, Math.floor((ev.clientX - r.left) / STEP_W)),
      midi: hi - Math.floor((ev.clientY - r.top) / ROW_H),
    };
  };
  let drag = null;
  cv.addEventListener('pointerdown', (ev) => {
    const v = m.voices.find((x) => x.id === edTrack);
    if (!v) return;
    const { step, midi } = at(ev);
    const hitNote = v.notes.find((n) => n.step <= step && step < n.step + n.len
      && (n.midi == null || n.midi === midi));
    if (ev.altKey || ev.button === 2) { ED.delNote(m, edTrack, step); edDirty = true; drawRoll(cv, m); return; }
    if (hitNote) {
      // grabbing the last step of a note resizes it; anywhere else moves it
      const onEnd = step === hitNote.step + hitNote.len - 1 && hitNote.len > 0;
      drag = { note: hitNote, mode: onEnd ? 'len' : 'move', step0: step, origin: { ...hitNote } };
    } else if (v.kind === 'note') {
      ED.setNote(m, edTrack, step, midi, 1);
      edDirty = true;
      drag = { note: v.notes.find((n) => n.step === step), mode: 'len', step0: step, origin: { step, len: 1 } };
    }
    // Capture so a drag that leaves the canvas still tracks. Guarded because a
    // synthetic event has no real pointer behind it to capture.
    try { cv.setPointerCapture(ev.pointerId); } catch { /* no live pointer */ }
    drawRoll(cv, m);
  });
  cv.addEventListener('pointermove', (ev) => {
    if (!drag) return;
    const { step, midi } = at(ev);
    if (drag.mode === 'len') {
      ED.setLen(m, edTrack, drag.note.step, Math.max(1, step - drag.note.step + 1));
    } else {
      const d = step - drag.step0;
      const ns = Math.max(0, drag.origin.step + d);
      ED.delNote(m, edTrack, drag.note.step);
      ED.setNote(m, edTrack, ns, drag.note.midi != null ? midi : drag.note.hit, drag.origin.len);
      drag.note = m.voices.find((x) => x.id === edTrack).notes.find((n) => n.step === ns);
      drag.step0 = step; drag.origin = { ...drag.note };
    }
    edDirty = true;
    drawRoll(cv, m);
  });
  const endDrag = () => { drag = null; };
  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', endDrag);
  cv.addEventListener('contextmenu', (ev) => ev.preventDefault());

  // --- transport and bar operations ---------------------------------------
  const bar = el('div', 'edbar');
  const playBtn = el('button', 'btn', '▶ PLAY');
  const stopBtn = el('button', 'btn tiny', '■');
  const recBtn = el('button', 'recbtn', '● OVERDUB');
  const selLabel = el('span', 'meta', '');
  const insBtn = el('button', 'btn tiny', 'INSERT BAR');
  const delBtn = el('button', 'btn tiny', 'DELETE BARS');
  const clrBtn = el('button', 'btn tiny', 'CLEAR');
  const selFrom = el('input'); selFrom.type = 'number'; selFrom.min = '1'; selFrom.style.width = '58px';
  const selTo = el('input'); selTo.type = 'number'; selTo.min = '1'; selTo.style.width = '58px';
  selFrom.value = String((edSel?.from ?? 0) + 1);
  selTo.value = String(edSel?.to ?? m.bars);
  const readSel = () => {
    const f = Math.max(0, (+selFrom.value || 1) - 1);
    const t = Math.min(m.bars, Math.max(f + 1, +selTo.value || m.bars));
    edSel = { from: f, to: t };
    selLabel.textContent = `bars ${f + 1}–${t}`;
    drawRoll(cv, m);
  };
  selFrom.oninput = readSel; selTo.oninput = readSel;
  readSel();

  insBtn.onclick = () => { ED.insertBars(m, edSel.from, 1); edDirty = true; render(); };
  delBtn.onclick = () => { ED.deleteBars(m, edSel.from, edSel.to - edSel.from); edDirty = true; edSel = null; render(); };
  clrBtn.onclick = () => {
    ED.clearRange(m, edTrack, edSel.from * m.beats, edSel.to * m.beats);
    edDirty = true; drawRoll(cv, m);
  };

  let raf2 = 0;
  const follow = () => { if (!edPlay) { raf2 = 0; return; } drawRoll(cv, m); raf2 = requestAnimationFrame(follow); };
  const startPlay = async (recordInto) => {
    edStopPlay();
    const keep = { ...m, voices: m.voices.filter((v) => (edSolo.size ? edSolo.has(v.id) : !edMute.has(v.id))
      && v.id !== recordInto) };
    const buf = await edRender(keep);
    const c2 = audio();
    const src = c2.createBufferSource();
    src.buffer = buf; src.connect(master);
    const startAt = c2.currentTime + 0.15;
    src.start(startAt);
    edPlay = { src, startedAt: startAt };
    src.onended = () => { if (edPlay?.src === src) { edPlay = null; drawRoll(cv, m); } };
    if (!raf2) follow();
    return startAt;
  };
  playBtn.onclick = () => startPlay(null);
  stopBtn.onclick = () => { edStopPlay(); rec.running = false; recBtn.classList.remove('on'); recBtn.textContent = '● OVERDUB'; drawRoll(cv, m); };
  recBtn.onclick = async () => {
    if (rec.running) {
      rec.stop();
      edStopPlay();
      recBtn.classList.remove('on'); recBtn.textContent = '● OVERDUB';
      const q = quantise(rec.events, { bpm: m.bpm, beats: m.beats, grid: 1 });
      const target = edArmed || edTrack;
      const v = m.voices.find((x) => x.id === target);
      if (v) {
        q.voices.forEach((cells, i) => {
          const into = i === 0 ? v : (m.voices.find((x) => x.id === `${target}-${i}`)
            || (ED.addVoice(m, { id: `${target}-${i}`, inst: v.inst, mix: v.mix }), m.voices[m.voices.length - 1]));
          cells.forEach((cell, step) => {
            if (cell === '-' || cell === '.') return;
            let len = 1;
            while (cells[step + len] === '.') len += 1;
            const midiN = ED.toModel(loadScore(
              `@track t\n bpm 120\n beats 4\n era 8bit\n@voice a inst=lead mix=0.2\n  ${cell}  -   -   - \n`, 't',
            )).voices[0].notes[0]?.midi;
            if (midiN != null) ED.setNote(m, into.id, step, midiN, len);
          });
        });
        edDirty = true;
      }
      render();
      return;
    }
    if (!edArmed && !edTrack) return;
    await ensureLive();
    const startAt = await startPlay(edArmed || edTrack);
    rec.start(startAt);
    recBtn.classList.add('on'); recBtn.textContent = '■ STOP';
  };

  bar.append(playBtn, stopBtn, recBtn, info('OVERDUB',
    'Plays the other tracks and records what you play into the armed one. Arm a track with the '
    + 'round button beside its name, or make a new one.'),
    el('span', 'sp'),
    el('span', 'meta', 'BARS'), selFrom, el('span', 'meta', '–'), selTo,
    insBtn, delBtn, clrBtn);
  c.append(bar);
  c.append(el('div', 'hint',
    'Click to add a note, drag it to move, drag its right edge to lengthen, alt-click or '
    + 'right-click to delete. INSERT and DELETE act on the bar range; CLEAR empties it on the '
    + 'selected track only.'));

  requestAnimationFrame(() => drawRoll(cv, m));
  return c;
}

// -------------------------------------------------------------------- views --

let tab = 'tracks';
let pick = { tracks: null, fx: null };
let query = '';

/** Substring match over a row's name, description and tags. */
const hit = (row, ...fields) => {
  if (!query) return true;
  const q = query.toLowerCase();
  return fields.some((f) => String(f ?? '').toLowerCase().includes(q));
};
const setCount = (shown, total) => {
  const n = $('#qn');
  if (n) n.textContent = query ? `${shown} of ${total}` : '';
};

function render() {
  const main = $('#main');
  main.innerHTML = '';

  if (tab === 'tracks') {
    const g = el('div', 'grid');
    const list = el('div', 'list');
    const shown = manifest.tracks.filter((x) => hit(x, x.id, x.name, x.tags.join(' ')));
    setCount(shown.length, manifest.tracks.length);
    // Your tracks first and under their own heading. Anything you record or
    // write does not belong filed among the examples that came with the tool.
    const mine = shown.filter((t) => !t.shipped);
    const theirs = shown.filter((t) => t.shipped);
    const group = (label, rows) => {
      if (!rows.length) return;
      if (mine.length) list.append(el('div', 'grp', label));
      for (const t of rows) {
        const b = el('button', pick.tracks === t.id ? 'on' : '');
        b.append(el('div', 't', esc(t.name)));
        b.append(el('div', 's', `${t.seconds}s · ${t.bars} bars · ${t.voices.length}v · ${esc(t.tags[0] || '')}`));
        b.onclick = () => { pick.tracks = t.id; stop(); mutes.clear(); solos.clear(); era = t.era; render(); };
        list.append(b);
      }
    };
    group('YOURS', mine);
    group('INCLUDED', theirs);
    g.append(list);
    const t = shown.find((x) => x.id === pick.tracks) || shown[0] || manifest.tracks[0];
    if (!t) { main.append(g); return; }
    pick.tracks = t.id;
    nativeEra = t.era;
    g.append(trackView(t));
    main.append(g);
    document.querySelectorAll('#era button').forEach((b) => b.classList.toggle('on', b.dataset.era === era));
    markNative();
    return;
  }

  nativeEra = null; markNative();
  if (tab === 'editor') {
    setCount(0, 0);
    main.append(editorView());
    return;
  }
  if (tab === 'keys') {
    setCount(0, 0);
    main.append(keysView());
    return;
  }
  if (tab === 'fx') {
    const g = el('div', 'fxgrid');
    const shown = manifest.fx.filter((x) => hit(x, x.id, x.desc, (x.tags || []).join(' ')));
    setCount(shown.length, manifest.fx.length);
    for (const f of shown) g.append(fxCard(f));
    if (!shown.length) g.append(el('div', 'meta', `nothing matches "${esc(query)}"`));
    main.append(g);
    return;
  }

  if (tab === 'instruments') {
    const g = el('div', 'card');
    g.append(el('h2', null, 'Instruments'));
    g.append(el('div', 'meta', 'An instrument is a list of layers, summed.'));
    setCount(manifest.instruments.filter((x) => hit(x, x.name, x.desc)).length,
      manifest.instruments.length);
    for (const e of ERAS) {
      g.append(el('h3', null, e));
      const t = el('table');
      t.innerHTML = '<tr><th>name</th><th>layers</th><th>what it is</th></tr>';
      const rows = manifest.instruments.filter((x) => x.era === e && hit(x, x.name, x.desc));
      for (const i of rows) {
        const L = (i.detail.layers || []).map((l) => {
          const bits = [l.osc];
          if (l.duty) bits.push(`${l.duty * 100}%`);
          if (l.semi) bits.push(`${l.semi > 0 ? '+' : ''}${l.semi}st`);
          if (l.detune) bits.push(`${l.detune > 0 ? '+' : ''}${l.detune}c`);
          if (l.delay) bits.push(`+${l.delay}s`);
          return bits.join(' ');
        }).join('<br>') || (i.detail.drums ? 'kit' : '—');
        const tr = el('tr', null,
          `<td></td><td>${esc(i.name)}</td><td class="n">${L}</td><td class="n">${esc(i.desc || '')}</td>`);
        const b = el('button', 'hear', '\u25b6');
        b.title = `Hear ${i.name}`;
        b.onclick = async () => {
          if (probing) { try { probing.stop(); } catch {} probing = null; }
          // The phrase comes from core/probe.js, so this and `sound hear`
          // play the same thing: a legato line for sustained voices, a run
          // for struck ones, a bass part for basses, a beat for kits.
          const src = probeScore(i.name, i.detail);
          b.classList.add('lit');
          try {
            const bufs = await buffers('track', `probe-${i.name}`, {}, null, src);
            const node = audio().createBufferSource();
            node.buffer = bufs[ERAS.indexOf(i.era)];
            node.connect(master);
            node.start();
            probing = node;
            node.onended = () => { b.classList.remove('lit'); if (probing === node) probing = null; };
          } catch (e) { b.classList.remove('lit'); fail(`hearing ${i.name}`, e); }
        };
        tr.firstChild.append(b);
        t.append(tr);
      }
      g.append(t);
    }
    main.append(g);
  }
}

// -------------------------------------------------------------------- wiring --

$('#tabs').onclick = (e) => {
  const b = e.target.closest('button'); if (!b) return;
  tab = b.dataset.tab;
  document.querySelectorAll('#tabs button').forEach((x) => x.classList.toggle('on', x === b));
  render();
};
$('#q').oninput = (e) => { query = e.target.value.trim(); render(); };
$('#era').onclick = (e) => { const b = e.target.closest('button'); if (b) setEra(b.dataset.era); };
$('#vol').oninput = (e) => { if (master) master.gain.value = +e.target.value; };
$('#bass').oninput = (e) => { if (bassEq) bassEq.gain.value = +e.target.value; };
$('#treb').oninput = (e) => { if (trebEq) trebEq.gain.value = +e.target.value; };
$('#eqreset').onclick = () => {
  $('#bass').value = '0'; $('#treb').value = '0';
  if (bassEq) bassEq.gain.value = 0;
  if (trebEq) trebEq.gain.value = 0;
};
addEventListener('keyup', (e) => {
  const semi = semiFor(e);
  if (semi !== undefined && kbDown.has(semi)) { kbDown.delete(semi); kbStop?.(semi); }
});
// A key held while the tab loses focus never sends keyup, so it would sound
// forever. Cut everything when the window goes away.
addEventListener('blur', () => { if (kbDown.size) { kbDown.clear(); panic(); } });
addEventListener('keydown', (e) => {
  if (tab === 'keys' && !e.target.matches('input,textarea,select') && !e.metaKey && !e.ctrlKey) {
    const semi = semiFor(e);
    if (semi !== undefined) {
      e.preventDefault();
      if (!e.repeat && !kbDown.has(semi)) { kbDown.add(semi); kbPlay?.(semi); }
      return;
    }
    if (e.key === 'Escape' && e.shiftKey) { panic(); kbDown.clear(); return; }
  }
  if (e.target.matches('input,textarea')) {
    if (e.key === 'Escape') { e.target.value = ''; query = ''; e.target.blur(); render(); }
    return;
  }
  if (e.key === '/') { e.preventDefault(); $('#q').focus(); return; }
  if (e.key === ' ') { e.preventDefault(); $('#bplay')?.click(); }
  else if (e.key === '1') setEra('8bit');
  else if (e.key === '2') setEra('16bit');
  else if (e.key.toLowerCase() === 'l') setLoop(!looping);
  else if (e.key === 'Escape') { stop(); }
  else if (e.key === 'ArrowLeft') $('#bback')?.click();
});

const r = await fetch('data.json');
manifest = await r.json();
// The substitution table lives in core/instruments.js and rides along in the
// manifest, so the page never has to guess what a voice becomes on the other rig.
manifest.substitute = manifest.substituteTable;
if (manifest.tracks.length) { era = manifest.tracks[0].era; nativeEra = era; }
document.querySelectorAll('#era button').forEach((b) => b.classList.toggle('on', b.dataset.era === era));
markNative();
render();
</script>
</body>
</html>
